name: cdx-rocks
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdx-rocks:latest
    container_name: cdx-rocks-app
    ports:
      - "${CDX_PORT:-7860}:7860"
    volumes:
      - ./all_warc_paths.txt.zst:/app/all_warc_paths.txt.zst
      - ./rocksdb_index:/app/data:ro
    environment:
      - ENV=production
      - PYTHONUNBUFFERED=1
      - ROCKS_READONLY=/app/data
      - ROCKS_SHADOW=/app/rocksdb
      - CATALOG_PATH=/app/all_warc_paths.txt.zst
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 2.2gb
        reservations:
          memory: 2gb
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7860/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
