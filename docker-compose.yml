name: cdx-rocks
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdx-rocks:latest
    container_name: cdx-rocks-app
    ports:
      - "${CDX_PORT:-7860}:7860"
    volumes:
      - ./all_warc_paths.txt.zst:/app/all_warc_paths.txt.zst
      - ./rocksdb_index:/app/data
    environment:
      - ENV=production
      - PYTHONUNBUFFERED=1
      - ROCKS_BUCKET_DIR=/app/data
      - ROCKS_LOG_DIR=/app/rocksdb_logs/
      - CATALOG_PATH=/app/all_warc_paths.txt.zst
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
